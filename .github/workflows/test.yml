name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: go build (lite tag)
        run: go build -tags lite ./...

  # Windows is intentionally not in the matrix above — several existing
  # tests (glossary loader, grammars install/remove) touch the real user
  # HOME or rely on POSIX permission bits in ways that fail under Windows.
  # The cross-build job below still verifies the codebase compiles for
  # windows/amd64. A future release can sweep through and add
  # windows-aware Skip()s to those tests.

  cross-build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: build examples for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build ./examples/basic/
          go build ./examples/enrichment/
